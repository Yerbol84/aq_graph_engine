name: aq_graph_engine
description: AQ Graph Engine — pure Dart runtime for Workflow, Instruction and Prompt graphs.
  Can run locally (desktop) or on a server (web service).
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  aq_schema:
    path: ../aq_schema

  uuid: ^4.0.0
  http: ^1.1.0
  web_socket_channel: ^3.0.0
  logging: ^1.2.0

dev_dependencies:
  uuid: ^4.0.0
  lints: ^3.0.0
  test: ^1.24.0