name: flutter_graph_client_example
description: Flutter пример работы с AQ Graph Engine через HTTP.
publish_to: none
version: 1.0.0

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # Протокол — только из корневого пакета
  aq_schema:
    path: ../../../aq_schema

  # Клиент движка — HttpGraphEngineClient + IGraphEngineClient
  aq_graph_engine:
    path: ../../

  uuid: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
